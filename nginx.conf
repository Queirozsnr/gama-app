# Upgrade de conexão para o WebSocket do SignalR (/api/hubs/...).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos .gz são gerados no build (Dockerfile) — sem compressão em runtime.
    gzip_static on;
    gzip_vary   on;

    # Proxy para a API — /api/xxx → http://gama-api:5000/xxx
    location /api/ {
        proxy_pass         http://gama-api:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200M;
    }

    # CanvasKit, fontes e assets só mudam quando o Flutter/app é atualizado.
    location ~ ^/(canvaskit|assets|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Flutter SPA — no-cache = navegador reutiliza a cópia local e só confirma
    # com o servidor (304 via ETag), então deploys novos aparecem na hora.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
