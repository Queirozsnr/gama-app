<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GAMA — Gestão de Oficinas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GAMA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GAMA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4f0e6;
      font-family: -apple-system, 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gama-loading {
      position: fixed;
      inset: 0;
      background: #f4f0e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #gama-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .gama-logo {
      width: 56px;
      height: 56px;
      background: #FF7A1A;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #1a1714;
      letter-spacing: -0.5px;
    }

    .gama-name {
      font-size: 22px;
      font-weight: 800;
      color: #1f1c17;
      letter-spacing: -0.4px;
    }

    .gama-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #e7e0d0;
      border-top-color: #FF7A1A;
      border-radius: 50%;
      animation: gama-spin 0.8s linear infinite;
    }

    @keyframes gama-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gama-loading">
    <div class="gama-logo">G</div>
    <div class="gama-name">GAMA</div>
    <div class="gama-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('gama-loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 350);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
