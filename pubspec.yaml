name: gama_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  file_picker: ^8.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  url_launcher: ^6.3.1
  web: ^1.1.1
  signalr_netcore: ^1.3.6
  image_picker: ^1.0.0
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_file: ^3.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_windows.png"
  adaptive_icon_background: "#FF7A1A"
  adaptive_icon_foreground: "assets/icon/icon_android.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon_windows.png"
    icon_size: 48

flutter:

  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
